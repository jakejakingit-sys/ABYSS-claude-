name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    # Runs the portable core's tests with plain gcc. Needs no calculator toolchain.a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -f Makefile.host

  calculator-build:
    # UNVERIFIED: this job has never run. The CEdev URL and zip layout are from memory.
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install CEdev
        run: |
          curl -fL -o cedev.zip \
            https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.zip
          unzip -q cedev.zip -d "$HOME"
          ls "$HOME/CEdev" "$HOME/CEdev/bin"
          echo "CEDEV=$HOME/CEdev" >> "$GITHUB_ENV"
          echo "$HOME/CEdev/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: cedev-config --makefile

      - name: Build
        run: make

      - name: Check output
        run: |
          test -s bin/ABYSS.8xp
          ls -l bin/ABYSS.8xp

      - uses: actions/upload-artifact@v4
        with:
          name: ABYSS-8xp
          path: bin/ABYSS.8xp
          if-no-files-found: error
